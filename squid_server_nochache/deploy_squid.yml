---
- name: Configure Squid Proxy Server (base settings)
  hosts: all
  become: true
  vars_files:
    - vars/squid_vars.yml
  tasks:
    - name: Install Squid proxy server
      apt:
        name: squid
        state: present
        update_cache: true

    - name: Install Apache utils for htpasswd
      apt:
        name: apache2-utils
        state: present

    - name: Create Squid authentication file
      command: htpasswd -b -c {{ squid_auth_path }} {{ auth_user }} {{ auth_password }}
      args:
        creates: "{{ squid_auth_path }}"

    - name: Backup original squid.conf
      copy:
        src: "{{ squid_conf_path }}"
        dest: "{{ squid_conf_path }}.bak"
        remote_src: yes
        owner: root
        group: root
        mode: '0644'

    - name: Deploy custom squid.conf
      template:
        src: templates/squid.conf.j2
        dest: /etc/squid/squid.conf
        owner: root
        group: root
        mode: '0644'

    - name: Restart Squid service
      service:
        name: squid
        state: restarted
        enabled: true