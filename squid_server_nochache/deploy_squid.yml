---
- name: Configure Squid Proxy Server (base settings)
  hosts: proxy_servers
  become: true
  vars:
    squid_conf_path: /etc/squid/squid.conf
    squid_auth_path: /etc/squid/passwd
    proxy_port: 3128
    auth_user: proxyuser
    auth_password: proxypass
  tasks:

    - name: Install Squid proxy server
      apt:
        name: squid
        state: present
        update_cache: true

    - name: Install Apache utils for htpasswd
      apt:
        name: apache2-utils
        state: present

    - name: Create Squid authentication file
      command: htpasswd -b -c {{ squid_auth_path }} {{ auth_user }} {{ auth_password }}
      args:
        creates: "{{ squid_auth_path }}"

    - name: Backup original squid.conf
      copy:
        src: "{{ squid_conf_path }}"
        dest: "{{ squid_conf_path }}.bak"
        remote_src: yes
        owner: root
        group: root
        mode: '0644'

    - name: Configure squid.conf
      blockinfile:
        path: "{{ squid_conf_path }}"
        block: |
          cache deny all

          auth_param basic program /usr/lib/squid/basic_ncsa_auth {{ squid_auth_path }}
          auth_param basic children 5
          auth_param basic realm Squid proxy-caching web server
          auth_param basic credentialsttl 2 hours
          acl authenticated proxy_auth REQUIRED
          http_access allow authenticated

          acl localhost src 127.0.0.1/32
          http_access allow localhost

          http_access deny all
        state: present

    - name: Restart Squid service to apply changes
      service:
        name: squid
        state: restarted
        enabled: true