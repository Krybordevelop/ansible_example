---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - tar
      - ufw
    state: present
    update_cache: true

- name: Create Prometheus group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true

- name: Create Prometheus system user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    home: "{{ prometheus_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(prometheus_user) }}"
    group: "{{ item.group | default(prometheus_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ prometheus_config_dir }}"
      mode: "0755"
      owner: root
      group: "{{ prometheus_group }}"
    - path: "{{ prometheus_data_dir }}"
      mode: "0750"
    - path: "{{ prometheus_install_dir }}"
      mode: "0755"
      owner: root
      group: root

- name: Download Prometheus archive
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: /tmp/prometheus.tar.gz
    mode: "0644"
    checksum: "{{ prometheus_checksum if prometheus_checksum else omit }}"

- name: Extract Prometheus archive
  ansible.builtin.unarchive:
    src: /tmp/prometheus.tar.gz
    dest: "{{ prometheus_install_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ prometheus_release_dir }}/prometheus"

- name: Install Prometheus binaries
  ansible.builtin.copy:
    src: "{{ prometheus_release_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - promtool
  notify: Restart Prometheus

- name: Install Prometheus console files
  ansible.builtin.copy:
    src: "{{ prometheus_release_dir }}/{{ item }}/"
    dest: "{{ prometheus_install_dir }}/{{ item }}/"
    remote_src: true
    owner: root
    group: root
    mode: preserve
  loop:
    - consoles
    - console_libraries

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_path }}"
    owner: root
    group: "{{ prometheus_group }}"
    mode: "0640"
  notify: Restart Prometheus

- name: Deploy Prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Prometheus

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "{{ prometheus_ssh_port }}"
    proto: tcp

- name: Allow Prometheus through UFW
  community.general.ufw:
    rule: allow
    port: "9090"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ prometheus_firewall_allowed_sources }}"

- name: Enable UFW with a deny-by-default policy
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: "{{ prometheus_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
