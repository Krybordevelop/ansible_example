---
- name: Configure Squid proxy servers
  hosts: proxy_cache:proxy_nocache
  become: true
  vars_files:
    - vars/squid_vars.yml
  vars:
    squid_cache_enabled: "{{ 'proxy_cache' in group_names }}"
  tasks:
    - name: Install Squid proxy server
      ansible.builtin.apt:
        name: squid
        state: present
        update_cache: true

    - name: Install Apache utils for htpasswd
      ansible.builtin.apt:
        name: apache2-utils
        state: present

    - name: Create Squid authentication file
      ansible.builtin.command: htpasswd -b -c {{ squid_auth_path }} {{ auth_user }} {{ auth_password }}
      args:
        creates: "{{ squid_auth_path }}"

    - name: Backup original squid.conf
      ansible.builtin.copy:
        src: "{{ squid_conf_path }}"
        dest: "{{ squid_conf_path }}.bak"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
        force: false

    - name: Deploy custom squid.conf
      ansible.builtin.template:
        src: templates/squid.conf.j2
        dest: "{{ squid_conf_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: Restart Squid service

    - name: Initialize Squid cache directory
      ansible.builtin.command:
        cmd: "squid -z -f {{ squid_conf_path }}"
      args:
        creates: "{{ squid_cache_dir }}/00"
      when: squid_cache_enabled

    - name: Ensure Squid service is enabled and running
      ansible.builtin.service:
        name: squid
        state: started
        enabled: true

  handlers:
    - name: Restart Squid service
      ansible.builtin.service:
        name: squid
        state: restarted
