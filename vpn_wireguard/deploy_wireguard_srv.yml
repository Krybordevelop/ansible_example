---
- name: Install WireGuard and WGDashboard
  hosts: all
  become: true
  vars:
    wg_interface: wg0
    wg_port: 51820
    wg_dashboard_port: 10086
    wg_dashboard_dir: /usr/local/src/wgdashboard

  tasks:
    - name: Update apt cache and install required dependencies
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
          - git
          - python3
          - python3-pip
          - python3-venv
          - net-tools
          - iptables
        state: present
        update_cache: true

    - name: Enable IPv4 forwarding in sysctl
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - name: Clone WGDashboard repository
      ansible.builtin.git:
        repo: https://github.com/donaldzou/WGDashboard.git
        dest: "{{ wg_dashboard_dir }}"
        version: main
        force: true

    - name: Setup Python virtual environment and install dependencies
      ansible.builtin.command:
        cmd: ./wgd.sh install
        chdir: "{{ wg_dashboard_dir }}/src"
        creates: "{{ wg_dashboard_dir }}/src/venv"

    - name: Make wgd.sh executable
      ansible.builtin.file:
        path: "{{ wg_dashboard_dir }}/src/wgd.sh"
        mode: '0755'

    - name: Create Systemd service for WGDashboard
      ansible.builtin.copy:
        dest: /etc/systemd/system/wgdashboard.service
        content: |
          [Unit]
          Description=WGDashboard Service
          After=network.target

          [Service]
          Type=forking
          WorkingDirectory={{ wg_dashboard_dir }}/src
          ExecStart={{ wg_dashboard_dir }}/src/wgd.sh start
          ExecStop={{ wg_dashboard_dir }}/src/wgd.sh stop
          Restart=on-failure
          User=root

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd, enable and start WGDashboard service
      ansible.builtin.systemd:
        name: wgdashboard
        daemon_reload: true
        enabled: true
        state: started

  post_tasks:
    - name: Verify WGDashboard service status
      ansible.builtin.systemd:
        name: wgdashboard
      register: wgd_status

    - name: Confirm installation success
      ansible.builtin.debug:
        msg: "WGDashboard successfully started! Open http://<IP_СЕРВЕРА>:{{ wg_dashboard_port }} for the initial setup."
      when: wgd_status.status.ActiveState == "active"