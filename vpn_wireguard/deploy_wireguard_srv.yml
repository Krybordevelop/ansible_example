---
- name: Install WireGuard and WGDashboard
  hosts: all
  become: true
  vars:
    wg_interface: wg0
    wg_port: 51820
    wg_dashboard_port: 10086
    wg_dashboard_dir: /usr/local/src/wgdashboard

  tasks:
    - name: Update apt cache and install required dependencies
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
          - git
          - python3
          - python3-pip
          - python3-venv
          - net-tools
          - iptables
        state: present
        update_cache: true

    - name: Enable IPv4 forwarding in sysctl
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - name: Clone WGDashboard repository
      ansible.builtin.git:
        repo: https://github.com/donaldzou/WGDashboard.git
        dest: "{{ wg_dashboard_dir }}"
        version: main
        force: true

    - name: Setup Python virtual environment and install dependencies
      ansible.builtin.command:
        cmd: ./wgd.sh install
        chdir: "{{ wg_dashboard_dir }}/src"
        creates: "{{ wg_dashboard_dir }}/src/venv"

    - name: Make wgd.sh executable
      ansible.builtin.file:
        path: "{{ wg_dashboard_dir }}/src/wgd.sh"
        mode: '0755'

    - name: Create Systemd service for WGDashboard from template
      ansible.builtin.template:
        src: wgdashboard.service.j2
        dest: /etc/systemd/system/wgdashboard.service
        mode: '0644'
      notify: Restart wgdashboard

  post_tasks:
    - name: Verify WGDashboard service status
      ansible.builtin.systemd:
        name: wgdashboard
      register: wgd_status

    - name: Confirm installation success
      ansible.builtin.debug:
        msg: "WGDashboard successfully started! Open http://{{ ansible_host }}:{{ wg_dashboard_port }} for the initial setup."
      when: wgd_status.status.ActiveState == "active"

  handlers:
    - name: Restart wgdashboard
      ansible.builtin.systemd:
        name: wgdashboard
        state: restarted
        daemon_reload: true
